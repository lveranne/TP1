[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churnlab"
version = "0.1.0"
description = "A reproducible churn prediction project with Git"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]